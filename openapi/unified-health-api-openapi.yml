openapi: 3.2.0
info:
  title: unified-mcp-service Health API
  version: 0.0.59
tags:
- name: Health
paths:
  /health/:
    get:
      tags:
      - Health
      summary: Health Check
      description: Basic health check endpoint.
      operationId: health_check_health__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
  /health:
    get:
      tags:
      - Health
      summary: Health Check
      description: Basic health check endpoint.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
  /health/ready:
    get:
      tags:
      - Health
      summary: Readiness Check
      description: Readiness check endpoint.
      operationId: readiness_check_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
  /health/live:
    get:
      tags:
      - Health
      summary: Liveness Check
      description: Liveness check endpoint.
      operationId: liveness_check_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
components:
  schemas:
    HealthCheckResponse:
      properties:
        status:
          type: string
          title: Status
        message:
          type: string
          title: Message
      type: object
      required:
      - status
      - message
      title: HealthCheckResponse
      description: Health check response payload.
