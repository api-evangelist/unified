note: >-
  Unified publishes no rate-limit documentation and emits no rate-limit headers on any anonymous
  response. The headers returned by both hosts are date, content-type, content-length, server
  (uvicorn) and apigw-requestid, plus www-authenticate on the 401 — there is no X-RateLimit-*,
  RateLimit-*, or Retry-After. An agent calling Unified therefore has no runtime budget signal at
  all and can only discover a limit by hitting it. AWS API Gateway sits in front of the service
  and may enforce an account-level throttle that is simply not surfaced. This is an honest zero,
  not an unchecked field.
