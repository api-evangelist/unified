apis:
- aid: unified:unified-mcp-service
  name: Unified MCP Service
  description: >-
    The Unified MCP Service is the company's agent-facing surface. Its remote Model Context
    Protocol endpoint at https://mcp.unified.com/mcp answers JSON-RPC over HTTP and is gated by
    OAuth bearer tokens issued by https://mcp.unified.com/; an anonymous tools/list call returns
    401 invalid_token with an RFC 6750 WWW-Authenticate challenge naming the RFC 9728 resource
    metadata document. The same FastAPI build is served on api.unified.com, which publishes an
    OpenAPI 3.1.0 description covering the root and health/readiness/liveness endpoints.
  humanURL: https://www.unified.com/
  baseURL: https://api.unified.com
