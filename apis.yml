aid: unified
name: Unified
description: >-
  Unified (Unified Enterprise Corp.) is a New York based omnichannel digital advertising
  company that pairs a purpose-built social advertising insights and investment-intelligence
  platform with managed campaign services across paid social, programmatic, OTT and digital
  audio. Client access to the platform runs through the get.unified.com application and a
  GitBook-hosted documentation space at docs.unified.com that is behind single sign-on. The
  company also operates a production remote Model Context Protocol server at
  https://mcp.unified.com/mcp, fronted by its own OAuth authorization server (RFC 8414
  metadata, RFC 7591 dynamic client registration, PKCE S256) and an RFC 9728 protected-resource
  descriptor, plus a FastAPI operations service at api.unified.com that publishes an OpenAPI
  3.1 description of its root and health endpoints. iHeartMedia, a long-standing partner and
  investor, is reported to have acquired the company; Unified continues to operate under its
  own brand at unified.com.
