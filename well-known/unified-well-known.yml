  WWW-Authenticate resource_metadata parameter names. No security.txt, api-catalog, ai-plugin,
  openid-configuration, UCP/ACP, AAuth resource or agent card is served on any host.
  www.unified.com is a Netlify-hosted SPA that returns a 1.4 MB HTML 404 body for every unknown
  path — recorded as a miss, not a document.
