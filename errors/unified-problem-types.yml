note: >-
  The published OpenAPI documents NO 4xx or 5xx responses — every operation declares only a 200 —
  so nothing could be derived from the spec. The error semantics recorded here were observed live.
  Unified does NOT use RFC 9457 application/problem+json. The MCP endpoint returns the RFC 6750
  bearer error object (application/json, {error, error_description}) with a matching
  WWW-Authenticate header, and the FastAPI operations service returns a bare text/plain
  "Not Found" body on 404 rather than a JSON envelope. There is no anonymous error reference page
  to enrich from.
