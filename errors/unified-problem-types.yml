problem_types:
- code: invalid_token
  status: 401
  title: Bearer token invalid, expired, or unrecognized
  detail: >-
    "Authentication failed. The provided bearer token is invalid, expired, or no longer recognized
    by the server. To resolve: clear authentication tokens in your MCP client and reconnect. Your
    client should automatically re-register and obtain new tokens."
  remediation: >-
    Discard cached tokens, re-run dynamic client registration at https://mcp.unified.com/register,
